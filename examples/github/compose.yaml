name: cli-gateway-github

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--http-port=18080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:18080
    ports:
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18082:18082"
    volumes:
      - ../keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  gateway:
    build:
      context: ../..
      dockerfile: Containerfile
    command: ["-manifest", "/etc/cli-gateway/manifest.yaml"]
    depends_on:
      - keycloak
    environment:
      CLI_GATEWAY_GITHUB_CLIENT_SECRET: ${CLI_GATEWAY_GITHUB_CLIENT_SECRET:?set CLI_GATEWAY_GITHUB_CLIENT_SECRET}
      CLI_GATEWAY_OAUTH_STORE_KEY: ${CLI_GATEWAY_OAUTH_STORE_KEY:?set CLI_GATEWAY_OAUTH_STORE_KEY}
    network_mode: "service:keycloak"
    restart: on-failure
    volumes:
      - ./manifest.yaml:/etc/cli-gateway/manifest.yaml:ro
      - github-oauth:/var/lib/cli-gateway

volumes:
  github-oauth:
