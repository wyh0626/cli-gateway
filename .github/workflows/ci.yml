name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - run: make verify-m6
      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@v1
      - name: Verify white-label build
        run: |
          make build-client CLI_NAME=acme
          ./bin/acme version
          ./bin/acme --help | grep -q '^  acme'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          tags: cli-gateway:ci
